plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.subjectlift'
version = '0.1.0'

android {
  namespace "expo.modules.subjectlift"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Beta, unpatched since Nov 2023 — see the crash-risk comment in
  // SubjectLiftModule.kt. Do not bump past 16.0.0-beta1 without re-checking
  // whether a fix for the Android 16 (API 36) SIGSEGV has shipped.
  implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"
}
